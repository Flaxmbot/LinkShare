name: LinkShare CI/CD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew
      - run: ./gradlew :composeApp:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: composeApp/build/outputs/apk/release/*.apk

  build_windows:
    name: Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
      - run: .\gradlew.bat :composeApp:packageMsi --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: composeApp/build/compose/binaries/main/msi/*.msi

  build_macos:
    name: macOS Installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew
      - run: ./gradlew :composeApp:packageDmg --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: composeApp/build/compose/binaries/main/dmg/*.dmg

  build_linux:
    name: Linux Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew
      - run: ./gradlew :composeApp:packageDeb --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: composeApp/build/compose/binaries/main/deb/*.deb

  release:
    name: Create Release
    needs: [build_android, build_windows, build_macos, build_linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LinkShare ${{ github.ref_name }}
          body: |
            ## LinkShare ${{ github.ref_name }}

            High-Performance LAN & Wi-Fi Direct P2P File Sharing

            ### Downloads
            | Platform | File |
            |----------|------|
            | Android | `LinkShare-android.apk` |
            | Windows | `LinkShare-windows.msi` |
            | macOS | `LinkShare-macos.dmg` |
            | Linux | `LinkShare-linux.deb` |

            ### Features
            - HTTP/FTP server with Windows 11 File Explorer web portal
            - WebDAV protocol gateway for native OS mounting
            - BitTorrent-style swarm file distribution
            - Universal clipboard sync
            - PIN-secured file access
          files: |
            artifacts/**/*.apk
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.deb
          draft: false
          prerelease: false
