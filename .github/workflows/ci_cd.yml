name: LinkShare CI/CD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
      - name: Configure stable release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LINKSHARE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LINKSHARE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LINKSHARE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LINKSHARE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          cat > keystore/credentials.properties <<EOF
          RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$KEY_ALIAS
          RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF
      - run: chmod +x gradlew
      - run: ./gradlew :composeApp:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: composeApp/build/outputs/apk/release/*.apk

  build_windows:
    name: Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Add WiX to PATH
        run: echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $env:GITHUB_PATH
        shell: powershell
      - uses: gradle/actions/setup-gradle@v3
      - run: .\gradlew.bat :composeApp:packageMsi --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: composeApp/build/compose/binaries/main/msi/*.msi

  build_macos:
    name: macOS Installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew
      - run: ./gradlew :composeApp:packageDmg --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: composeApp/build/compose/binaries/main/dmg/*.dmg

  build_linux:
    name: Linux Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew
      - run: ./gradlew :composeApp:packageDeb --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: composeApp/build/compose/binaries/main/deb/*.deb

  release:
    name: Create Release
    needs: [build_android, build_windows, build_macos, build_linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LinkShare ${{ github.ref_name }}
          body: |
            ## LinkShare ${{ github.ref_name }}

            Offline-first local-network file sharing.

            ### Included artifacts
            - Android release APK
            - Windows MSI
            - macOS DMG
            - Debian Linux DEB

            See the repository README for supported features, security notes, and known limitations. This release does not claim BitTorrent protocol compatibility or bonded dual-link networking.
          files: |
            artifacts/**/*.apk
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.deb
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
