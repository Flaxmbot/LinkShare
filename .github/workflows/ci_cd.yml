name: LinkShare CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Setup Keystore from Secret
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks

      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/*.apk release-artifacts/LinkShare-v1.0.0-android.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkShare-Release-APK
          path: release-artifacts/LinkShare-v1.0.0-android.apk

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: LinkShare-Release-APK
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          name: LinkShare ${{ github.ref_name }}
          body: |
            ## LinkShare ${{ github.ref_name }}

            ### Downloads

            | Platform | File | Description |
            | :--- | :--- | :--- |
            | Android | `LinkShare-v1.0.0-android.apk` | Android 7.0+ (API 26) |

            ### What's Included
            - Embedded HTTP/WebDAV file server with Web UI
            - FTP server for desktop file manager access
            - ShareMe-style installed app extractor
            - Universal LAN clipboard sync
            - HTML5 media streaming with HTTP 206 partial content
            - Swarm P2P multi-peer parallel distribution
            - 4-digit PIN authentication & JSON audit logs

            ### Build from Source
            ```bash
            git clone https://github.com/Flaxmbot/LinkShare.git
            cd LinkShare
            ./gradlew assembleRelease
            ```
          draft: false
          prerelease: false
