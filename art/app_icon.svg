<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="120" height="120">
  <!-- Yellow Nougat Amber background badge with rounded corners -->
  <rect width="108" height="108" rx="22" fill="#FFB300" />
  
  <!-- Scaled and centered logo group ensuring safe-zone margin on all squircle/circle masks -->
  <g transform="translate(54 54) scale(0.8) translate(-54 -54) rotate(-16 54 54)">
    <!-- Outer Wireless Signal Wave Arc -->
    <path fill="none" stroke="#121212" stroke-width="4" stroke-linecap="round" d="M 76,28 A 15,15 0 0,1 84,44" />
    
    <!-- Second Signal Wave Arc -->
    <path fill="none" stroke="#121212" stroke-width="4" stroke-linecap="round" d="M 82,22 A 23,23 0 0,1 94,46" />
    
    <!-- Connecting Strut: Main Node to Top-Right Node -->
    <path fill="none" stroke="#121212" stroke-width="6" stroke-linecap="round" d="M 38,54 L 68,38" />
    
    <!-- Connecting Strut: Main Node to Bottom-Right Node -->
    <path fill="none" stroke="#121212" stroke-width="6" stroke-linecap="round" d="M 38,54 L 68,70" />
    
    <!-- Outer Ring for Main Left Node -->
    <circle cx="38" cy="54" r="13" fill="none" stroke="#121212" stroke-width="3" />
    
    <!-- Main Left Node Solid Circle -->
    <circle cx="38" cy="54" r="8.5" fill="#121212" />
    
    <!-- Top-Right Node Solid Circle -->
    <circle cx="68" cy="38" r="7.5" fill="#121212" />
    
    <!-- Bottom-Right Node Solid Circle -->
    <circle cx="68" cy="70" r="7.5" fill="#121212" />
    
    <!-- Inner Core Accent on Main Node -->
    <circle cx="38" cy="54" r="3" fill="#FFFFFF" />
  </g>
</svg>
